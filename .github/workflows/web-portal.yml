name: Check PHP and MySQL portal
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Podman on the runner
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Start the portal in Podman
        run: bash examples/ConferencePortal/bin/podman.sh up
      - name: Check real HTTP and MySQL behavior in a disposable database
        run: bash examples/ConferencePortal/bin/check-podman.sh
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conference-http-results
          path: examples/ConferencePortal/tests/results
      - name: Stop only portal containers
        if: always()
        run: bash examples/ConferencePortal/bin/podman.sh down
