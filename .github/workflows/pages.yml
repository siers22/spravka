name: Publish guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  windows-examples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and render WPF windows on Windows
        run: dotnet run --project tests/WpfSmoke/WpfSmoke.csproj -c Release
      - name: Check shared application logic
        run: dotnet run --project tests/CoreChecks/CoreChecks.csproj -c Release
      - name: Build the separate notes API
        run: dotnet build examples/NotesApi/NotesApi.csproj -c Release
      - name: Publish both desktop applications
        run: |
          dotnet publish examples/ExamGuide/ExamGuide.csproj -c Release -r win-x64 --self-contained true -o tmp/publish/ExamGuide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish examples/ShoeStore/ShoeStore.csproj -c Release -r win-x64 --self-contained true -o tmp/publish/ShoeStore
      - name: Keep Windows window previews
        uses: actions/upload-artifact@v4
        with:
          name: wpf-window-previews
          path: wpf-smoke
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Verify learning materials
        run: npm run check
      - name: Build site for its Pages address
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - name: Verify published assets
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run check:pages
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, windows-examples]
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
