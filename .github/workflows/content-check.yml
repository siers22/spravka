name: Check guide changes
on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE_PATH: /spravka/
      - run: npm run check:pages
        env:
          VITE_BASE_PATH: /spravka/
      - name: Keep the built site for branch review
        uses: actions/upload-artifact@v4
        with:
          name: guide-preview
          path: dist
          if-no-files-found: error
