<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="650" viewBox="0 0 1140 650"><rect width="1140" height="650" fill="#f8f9fa"/><style>text{font-family:Arial,sans-serif;fill:#123b70} .head{fill:white;font-weight:bold}</style><text x="30" y="35" font-size="22">ConferencePortal · MySQL · 4 tables / 3 foreign keys</text><rect x="30" y="70" width="320" height="210" rx="8" fill="white" stroke="#90b7e8"/><path d="M38 70 H342 Q350 70 350 78 V112 H30 V78 Q30 70 38 70" fill="#0d47a1"/><text class="head" x="48" y="98" font-size="19">users</text><text x="48" y="140" font-size="16">PK id</text><text x="48" y="168" font-size="16">UNIQUE login</text><text x="48" y="196" font-size="16">password_hash</text><text x="48" y="224" font-size="16">full_name / phone / email</text><text x="48" y="252" font-size="16">role / created_at</text><rect x="30" y="365" width="320" height="182" rx="8" fill="white" stroke="#90b7e8"/><path d="M38 365 H342 Q350 365 350 373 V407 H30 V373 Q30 365 38 365" fill="#0d47a1"/><text class="head" x="48" y="393" font-size="19">rooms</text><text x="48" y="435" font-size="16">PK id</text><text x="48" y="463" font-size="16">UNIQUE name</text><text x="48" y="491" font-size="16">description / image</text><text x="48" y="519" font-size="16">capacity</text><rect x="410" y="170" width="320" height="210" rx="8" fill="white" stroke="#90b7e8"/><path d="M418 170 H722 Q730 170 730 178 V212 H410 V178 Q410 170 418 170" fill="#0d47a1"/><text class="head" x="428" y="198" font-size="19">bookings</text><text x="428" y="240" font-size="16">PK id</text><text x="428" y="268" font-size="16">FK user_id → users.id</text><text x="428" y="296" font-size="16">FK room_id → rooms.id</text><text x="428" y="324" font-size="16">starts_at / payment</text><text x="428" y="352" font-size="16">status / created_at</text><rect x="790" y="170" width="320" height="182" rx="8" fill="white" stroke="#90b7e8"/><path d="M798 170 H1102 Q1110 170 1110 178 V212 H790 V178 Q790 170 798 170" fill="#0d47a1"/><text class="head" x="808" y="198" font-size="19">reviews</text><text x="808" y="240" font-size="16">PK id</text><text x="808" y="268" font-size="16">FK UNIQUE booking_id</text><text x="808" y="296" font-size="16">body</text><text x="808" y="324" font-size="16">created_at</text><g fill="none" stroke="#007bff" stroke-width="2"><path d="M350 180 H380 V250 H410"/><path d="M350 430 H380 V280 H410"/><path d="M730 265 H790"/></g><text x="358" y="160" font-size="14">1 : N</text><text x="355" y="455" font-size="14">1 : N</text><text x="737" y="245" font-size="14">1 : 0..1</text><text x="30" y="610" font-size="16">Owner of a review is derived through bookings.user_id; UNIQUE prevents duplicate reviews.</text></svg>